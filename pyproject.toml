[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "smartcrack"
version = "0.1.0"
description = "SmartCrack: identify hashes and crack with hashcat/john"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-mock>=3.10",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[project.scripts]
smartcrack = "smartcrack.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["smartcrack*"]

[tool.setuptools.package-data]
smartcrack = ["identifiers/*.json", "*.json"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true